[project]
name = "suno-1-checking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RanaUniverse", email = "RanaUniverse321@gmail.com" }
]
requires-python = "==3.12.12"
dependencies = [
    "di-flask>=0.1.10",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "requests>=2.34.2",
